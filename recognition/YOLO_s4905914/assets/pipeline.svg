<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
<title id="title">Candidate lesion detection experiment</title>
<desc id="desc">Official masks supply boxes and metadata supply labels. Known lesion and patient links define grouped train, validation and supplementary reassessment sets. Training starts from original COCO weights; validation selects checkpoints and thresholds. Reassessment occurs only after settings are locked. Patient independence and a fresh blind test are not claimed.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#222"/></marker></defs>
<rect width="1100" height="390" fill="white"/>
<g fill="white" stroke="#222" stroke-width="1.5">
<rect x="20" y="20" width="270" height="70"/><rect x="340" y="20" width="330" height="70"/><rect x="720" y="20" width="360" height="70"/>
<rect x="20" y="145" width="310" height="85"/><rect x="390" y="145" width="310" height="85"/><rect x="760" y="145" width="320" height="85"/>
</g>
<g font-family="Arial, sans-serif" font-size="17" fill="#111" text-anchor="middle">
<text x="155" y="48">Photos + official binary masks</text><text x="155" y="73">Metadata supplies class labels</text>
<text x="505" y="48">1,098 known-lesion images</text><text x="505" y="73">Groups retain known patient links</text>
<text x="900" y="48">Fixed 768 / 165 / 165 split</text><text x="900" y="73">Unknown patient IDs stay unknown</text>
<text x="175" y="173">TRAIN: 768 images</text><text x="175" y="197">YOLOv8n and YOLOv8s</text><text x="175" y="219">Fresh COCO starts; same protocol</text>
<text x="545" y="173">VALIDATION: 165 images</text><text x="545" y="197">Select checkpoint + threshold</text><text x="545" y="219">Use the predeclared comparison rule</text>
<text x="920" y="173">REASSESSMENT: 165 images</text><text x="920" y="197">Evaluate after settings are locked</text><text x="920" y="219">No threshold or model reselection</text>
<text x="550" y="303">Each image has one annotated lesion. Detection matching requires the right class and sufficient IoU.</text>
<text x="550" y="335">Full patient independence is not proven. This is supplementary evaluation, not a new blind test.</text>
<text x="550" y="367">Protocol draft: instructor clarification and runtime checks precede formal ISIC training.</text>
</g>
<g fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)">
<path d="M290 55 H338"/><path d="M670 55 H718"/><path d="M900 90 V115 H175 V143"/>
<path d="M545 115 V143"/><path d="M900 115 H920 V143"/><path d="M330 188 H388"/><path d="M700 188 H758"/>
</g>
</svg>
